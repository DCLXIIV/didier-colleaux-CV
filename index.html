<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Didier Colleaux — CV</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
    .loader{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .loader p{max-width:34rem;line-height:1.5}
  </style>
</head>
<body>
  <div class="loader" id="loader"><p>Chargement…</p></div>
  <noscript>
    <div class="loader"><p>JavaScript est nécessaire pour charger cette version responsive.</p></div>
  </noscript>
  <script>
    (async () => {
      const source = "./cv-source.html";
      try {
        const response = await fetch(source, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        let html = await response.text();
        const injection =
          '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">' +
          '<link rel="stylesheet" href="./responsive-guard.css">' +
          '<script src="./responsive-guard.js" defer><' + '/script>';
        if (/<head\b[^>]*>/i.test(html)) {
          html = html.replace(/<head\b[^>]*>/i, (match) => match + injection);
        } else {
          html = injection + html;
        }
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        const loader = document.getElementById('loader');
        loader.innerHTML =
          '<p>Impossible de charger la version optimisée. ' +
          '<a href="' + source.replace(/"/g, '&quot;') + '">Ouvrir la version source</a>.</p>';
      }
    })();
  </script>
</body>
</html>
